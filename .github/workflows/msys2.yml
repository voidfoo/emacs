name: Emacs MSYS2 Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { icon: '🟦', sys: mingw64 }
    name: 🚧${{ matrix.icon }} ${{ matrix.sys }}
    defaults:
      run:
        shell: msys2 {0}
    timeout-minutes: 120
    steps:

    - name: '⚙️ configure git core.autocrlf'
      shell: cmd
      run: git config --global core.autocrlf false
    - name: '⚙️ configure git core.eol'
      shell: cmd
      run: git config --global core.eol lf

    - name: '🧰 Checkout'
      uses: actions/checkout@v7
      with:
        fetch-depth: 20

    - name: '${{ matrix.icon }} Setup MSYS2'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{matrix.sys}}
        update: true
        install: >-
          git zip base-devel
          mingw-w64-x86_64-autotools
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-xpm-nox
          mingw-w64-x86_64-libtiff
          mingw-w64-x86_64-giflib
          mingw-w64-x86_64-libpng
          mingw-w64-x86_64-libjpeg-turbo
          mingw-w64-x86_64-librsvg
          mingw-w64-x86_64-libwebp
          mingw-w64-x86_64-lcms2
          mingw-w64-x86_64-jansson
          mingw-w64-x86_64-libgccjit
          mingw-w64-x86_64-libxml2
          mingw-w64-x86_64-gnutls
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-ctags
          mingw-w64-x86_64-freetype
          mingw-w64-x86_64-harfbuzz
          mingw-w64-x86_64-cairo
          mingw-w64-x86_64-libtree-sitter
          mingw-w64-x86_64-sqlite3
          mingw-w64-x86_64-libwinpthread
          mingw-w64-x86_64-texinfo
          mingw-w64-x86_64-rust

    - name: '📌 Set EMACS_VERSION'
      run: |
        EMACS_VERSION=$(git rev-parse --short HEAD~6)
        echo "EMACS_VERSION=$EMACS_VERSION" >> $GITHUB_ENV

    - name: '🚧 Build'
      run: |
        set -e
        ./autogen.sh
        ./configure \
          --prefix=/c/emacs-${EMACS_VERSION} \
          --with-modules \
          --with-tree-sitter \
          --with-native-compilation \
          --with-gnutls \
          --without-dbus \
          --without-pop \
          CFLAGS="-O2 -fno-optimize-sibling-calls"
        make
        make install

    - name: '📦 Pack'
      run: |
        git --no-pager log -m --abbrev-commit --date=relative -10
        cd /c
        zip -r /c/emacs-${EMACS_VERSION}.zip emacs-${EMACS_VERSION}/*

    - name: '📤 Upload'
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: C:/emacs-${{ env.EMACS_VERSION }}-${{ matrix.sys }}.zip
        path: C:/emacs-${{ env.EMACS_VERSION }}.zip
        archive: false
        if-no-files-found: ignore
